name: Validate Grant Data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Validate main grant data
        run: npm run validate

      - name: Validate language grant data
        run: npm run validate:languages

      - name: Merge all grant data
        run: npm run merge

      - name: Upload merged artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-grants
          path: data/grant-eligibility-merged.json