- id: ahrefs-ocaml-grant
  organization: Ahrefs
  program: Ahrefs Grant Program for OCaml
  entity_types:
    - Individual developer
    - Team
    - Organization
  geographic_focus:
    - Global
  industry_focus:
    - OCaml ecosystem
    - Compiler and core libraries
    - Developer tooling
    - Education
  grant_range:
    min: 0
    max: 50000
    currency: USD
  description: >-
    Supports meaningful, practical improvements to the OCaml ecosystem, including
    new tools, libraries, infrastructure, education, and long-term maintenance.
  website: https://discuss.ocaml.org/t/ahrefs-grant-program-for-ocaml/17604
  deadline: January 20, 2026 (inaugural cycle)
