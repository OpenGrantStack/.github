  program: Open Source Funding
  entity_types:
    - Individual maintainer
    - Open-source developer
  geographic_focus:
    - Global
  industry_focus:
    - Clojure ecosystem
    - ClojureScript
    - Libraries and tooling
  grant_range:
    min: 1500
    max: 90000
    currency: USD
  description: >-
